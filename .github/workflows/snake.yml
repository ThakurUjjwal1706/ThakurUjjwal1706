name: Generate Contribution Snake Animation

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: snake-update
  cancel-in-progress: true

jobs:
  build:
    name: Generate Snake SVG
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure profile directory exists
        run: mkdir -p profile

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ThakurUjjwal1706
          outputs: |
            profile/snake.svg?palette=github-dark&color_snake=#7aa2f7&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Generated SVG
        run: |
          if [ -s profile/snake.svg ] && grep -q "<svg" profile/snake.svg; then
            echo "✓ profile/snake.svg is valid"
          else
            echo "⚠ profile/snake.svg is invalid or empty, preserving prior version..."
            git checkout -- profile/snake.svg 2>/dev/null || true
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/snake.svg
          if git diff --staged --quiet; then
            echo "No changes to commit in contribution snake."
          else
            git commit -m "chore(snake): update contribution snake animation [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

